<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pixel Space Invaders — Improved</title>
<style>
body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; image-rendering: pixelated; }
canvas { border: 6px solid #0f0; image-rendering: pixelated; box-shadow: 0 0 40px #0f04; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let playerX = 300, bullets = [], aliens = [], alienDir = 1;
let score = 0, best = parseInt(localStorage.getItem('invadersBest')||'0');
let state = 'start', frame = 0;

function initAliens() {
  aliens = [];
  for (let r=0; r<5; r++) {
    for (let c=0; c<10; c++) {
      aliens.push({x: c*55+40, y: r*40+40, alive: true, type: r%3});
    }
  }
}

function drawAlien(a) {
  const x = a.x, y = a.y;
  ctx.fillStyle = a.type === 0 ? '#f0f' : a.type === 1 ? '#0ff' : '#ff0';
  ctx.fillRect(x+4, y+4, 24, 12);
  ctx.fillRect(x, y+8, 8, 8);
  ctx.fillRect(x+24, y+8, 8, 8);
  ctx.fillRect(x+8, y+16, 4, 4);
  ctx.fillRect(x+20, y+16, 4, 4);
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,640,480);
  // Stars
  ctx.fillStyle = '#fff';
  for (let i=0; i<30; i++) {
    ctx.fillRect((i*47)%640, (i*31+frame)%480, 2, 2);
  }

  // Player
  ctx.fillStyle = '#0f0';
  ctx.fillRect(playerX, 430, 40, 12);
  ctx.fillRect(playerX+16, 420, 8, 10);

  // Bullets
  ctx.fillStyle = '#fff';
  bullets.forEach(b => ctx.fillRect(b.x, b.y, 4, 10));

  // Aliens
  aliens.forEach(a => { if (a.alive) drawAlien(a); });

  ctx.fillStyle = '#0f0';
  ctx.font = '20px monospace';
  ctx.fillText('Score: '+score+'  Best: '+best, 10, 25);

  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,640,480);
    ctx.fillStyle = '#0f0';
    ctx.font = 'bold 40px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SPACE INVADERS', 320, 200);
    ctx.font = '18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Arrows to move | SPACE to shoot', 320, 250);
    ctx.fillText('SPACE to start', 320, 300);
  }
  if (state === 'over' || state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0,0,640,480);
    ctx.fillStyle = state === 'win' ? '#0f0' : '#f44';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(state === 'win' ? 'YOU WIN!' : 'GAME OVER', 320, 200);
    ctx.fillStyle = '#fff';
    ctx.font = '20px monospace';
    ctx.fillText('Score: '+score, 320, 250);
    ctx.fillText('SPACE to restart', 320, 300);
  }
}

function update() {
  if (state !== 'play') return;
  frame++;
  const speed = 1 + Math.floor((50 - aliens.filter(a=>a.alive).length)/10);
  let edge = false;
  aliens.forEach(a => {
    if (!a.alive) return;
    a.x += alienDir * speed;
    if (a.x < 0 || a.x > 600) edge = true;
    if (a.y > 400) state = 'over';
  });
  if (edge) {
    alienDir *= -1;
    aliens.forEach(a => a.y += 18);
  }

  bullets.forEach((b,i) => {
    b.y -= 7;
    aliens.forEach(a => {
      if (a.alive && b.x > a.x && b.x < a.x+32 && b.y > a.y && b.y < a.y+20) {
        a.alive = false;
        bullets.splice(i,1);
        score += 10;
        if (score > best) { best = score; localStorage.setItem('invadersBest', best); }
      }
    });
    if (b.y < 0) bullets.splice(i,1);
  });

  if (aliens.every(a => !a.alive)) state = 'win';
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  if ((state === 'start' || state === 'over' || state === 'win') && e.code === 'Space') {
    initAliens();
    bullets = [];
    score = 0;
    playerX = 300;
    alienDir = 1;
    state = 'play';
    return;
  }
  if (state !== 'play') return;
  if (e.key === 'ArrowLeft') playerX = Math.max(0, playerX-12);
  if (e.key === 'ArrowRight') playerX = Math.min(600, playerX+12);
  if (e.key === ' ' && bullets.length < 3) bullets.push({x: playerX+18, y:420});
});

initAliens();
loop();
</script>
</body>
</html>
